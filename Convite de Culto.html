<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #2563eb;
        --text: #1f2937;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #e0f2fe, var(--bg));
        color: var(--text);
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .card {
        width: min(calc(100% - 2rem), 540px);
        background: rgba(85, 194, 228, 0.72);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border-radius: 14px;
        box-shadow: 0 16px 36px rgba(37, 99, 235, 0.12);
        padding: 1.25rem;
      }

      .church-image {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0 0 0.35rem;
        color: var(--primary);
        font-size: 1.6rem;
      }

      h2 {
        margin: 0 0 1rem;
        font-size: 1.2rem;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 1rem;
      }

      button {
        background: var(--primary);
        color:white;
        border: none;
        border-radius: 10px;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-family: times new roman;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }

      button:hover {
        opacity: 0.9;
      }

      .info-item {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        margin: 0.75rem 0;
        color: var(--text);
        font-weight: 600;
      }

      .info-item i {
        color: var(--primary);
        width: 18px;
        text-align: center;
      }
     
    </style>
  </head>
  <body>
    <main class="card">
<div >
    <img class="church-image" src="igreja_1.webp" alt="Igreja Assembleia de Deus Arca da Aliança" />
      <h1>ASSEMBLEIA DE DEUS</h1>
        <h2>AD.ARCA DA ALIANÇA</h2>
        </div>
        <section>
            <p>
        Convida você para participar do culto de Domingo as 18 horas.
        Você é nosso convidado especial, venha e traga sua família para juntos adorarmos ao Senhor!
      </p>

      <div class="info-item">
        <i class="fa-solid fa-phone"></i>
        <span>Contato: (91) 98248-7263</span>
      </div>

      <div class="info-item">
        <i class="fa-solid fa-location-dot"></i>
        <span>Endereço: Quadra 0, 28 - Aurá, Ananindeua - PA.</span>
      </div>
        </section>
      
      <a href="https://maps.app.goo.gl/gEr5ApzBTGcpxext6" target="_blank">
  <button type="button"><i class="fa-solid fa-map-location-dot"></i> Localização</button>
</a>
    </main>
  </body>
</html>
